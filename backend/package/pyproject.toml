[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starring"
version = "0.7.1.dev0"
description = "starring 智能知识库与知识图谱平台核心后端包"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-sandbox>=0.0.26",
    "aiofiles>=24.1.0",
    "aiohttp>=3.14.1",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "chardet>=5.0.0",
    "colorlog>=6.9.0",
    "croniter>=2.0.0",
    "dashscope>=1.23.2",
    "deepagents>=0.6.7",
    "httpx>=0.27.0",
    "igraph>=0.11.8",
    "json-repair>=0.54.0",
    "langchain>=1.3.9",
    "langchain-community>=0.4",
    "langchain-core>=1.2.5",
    "langchain-deepseek>=1.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=1.0.2",
    "langchain-tavily>=0.2.13",
    "langchain-text-splitters>=1.0",
    "langfuse>=4.0.0",
    "langgraph>=1.0.1",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langgraph-cli[inmem]>=0.4",
    "loguru>=0.7.3",
    "markdownify>=1.1.0",
    "mcp>=1.20",
    "minio>=7.2.7",
    "neo4j>=5.28.1",
    "openai>=1.109",
    "openpyxl>=3.1.0",
    "Pillow>=10.5.0",
    "psycopg[binary,pool]>=3.3.3",
    "pyjwt>=2.13.0",
    "pytz>=2024.1",
    "pymilvus>=2.5.8",
    "pymupdf>=1.25.5",
    "pymysql>=1.1.0",
    "pypdf>=6.13.3",
    "pypinyin>=0.55.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.31",
    "python-pptx>=1.0.0",
    "pyyaml>=6.0.2",
    "readability-lxml>=0.8.1",
    "redis>=5.2.0",
    "rich>=13.7.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "tabulate>=0.9.0",
    "tavily-python>=0.7.0",
    "tenacity>=8.0.0",
    "tomli",
    "tomli-w",
    "tqdm>=4.66.4",
    "typer>=0.16.0",
    "wcmatch>=8.0.0",
    # Markdown 解析语义切分相关依赖
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.68.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["starring*"]


[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "langchain-anthropic>=1.4.6",
    "pypdf>=6.13.3",
    "starlette>=1.3.1",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
starring = { path = "package", editable = true }
